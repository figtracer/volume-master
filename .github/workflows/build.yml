name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Signal checks
        run: bash scripts/check.sh
      - name: Package and verify signature
        run: bash scripts/package.sh
