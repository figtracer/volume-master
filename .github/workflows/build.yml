name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Signal checks
        run: bash scripts/check.sh
      - name: Package and verify signature
        run: bash scripts/package.sh
